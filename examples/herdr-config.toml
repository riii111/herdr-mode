# Minimal Herdr settings that match herdr-mode's shipped keymaps.
# Merge these into ~/.config/herdr/config.toml; do not replace your whole config.

[keys]
prefix = "ctrl+semicolon"

focus_pane_left = ["prefix+h"]
focus_pane_down = ["prefix+j"]
focus_pane_up = ["prefix+k"]
focus_pane_right = ["prefix+l"]

previous_tab = ["prefix+["]
next_tab = ["prefix+]"]

previous_workspace = "prefix+shift+["
next_workspace = "prefix+shift+]"

previous_agent = "prefix+,"
next_agent = "prefix+."

switch_workspace = "prefix+shift+1..9"

new_workspace = "prefix+w"
new_tab = ["prefix+t"]
split_vertical = ["prefix+p"]
split_horizontal = ["prefix+shift+d"]

copy_mode = "prefix+v"
edit_scrollback = "prefix+shift+v"
detach = "prefix+shift+o"
close_pane = "prefix+shift+p"
close_tab = "prefix+shift+t"
close_workspace = "prefix+shift+w"

zoom = ["prefix+z"]
resize_mode = "prefix+r"

workspace_picker = "prefix+space"
goto = "prefix+g"
rename_pane = "prefix+alt+p"
rename_tab = "prefix+alt+t"
rename_workspace = "prefix+alt+w"

help = "prefix+?"
settings = "prefix+s"
reload_config = "prefix+shift+r"

# kitty matches windows whose title starts with "herdr".
# WezTerm also treats a foreground process named "herdr" as in-session.
[ui]
window_title = "herdr:{workspace}"
