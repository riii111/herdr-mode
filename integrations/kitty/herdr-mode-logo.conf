# Visual indicator only. This is not a brand logo for herdr-mode.
# Herdr logo © Herdr contributors, licensed under Apache-2.0. Modified for visibility.
# https://github.com/herdrdev/herdr/blob/v0.8.0/assets/logo.png
#
# Sized so the visible mark stays around 6% of the window despite
# transparent padding in the source image.
window_logo_scale 8.25

action_alias herdr_logo_on remote_control set-window-logo --position bottom-right --alpha 0.30 herdr-logo.png
action_alias herdr_logo_off remote_control set-window-logo none
