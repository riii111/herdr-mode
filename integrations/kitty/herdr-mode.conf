# Prefix chord. Must match Herdr keys.prefix (ctrl+semicolon).
# Update herdr_send_prefix and every ctrl+; map key if you change it.
action_alias herdr_send_prefix send_key ctrl+;

# cmdline points at the outer shell, so detect Herdr via the title it sets.
# Requires: ui.window_title = "herdr:{workspace}"
map --new-mode herdr --on-unknown passthrough --timeout 0 --when-focus-on title:^herdr ctrl+;
map --when-focus-on title:^herdr ctrl+; combine : herdr_logo_on : push_keyboard_mode herdr

map --new-mode herdr-copy --mode herdr --on-unknown passthrough --timeout 0 v
map --new-mode herdr-selection --mode herdr --on-unknown passthrough --timeout 0 space
map --new-mode herdr-resize --mode herdr --on-unknown passthrough --timeout 0 r

map --mode herdr esc combine : herdr_logo_off : pop_keyboard_mode
map --mode herdr ctrl+; combine : herdr_logo_off : pop_keyboard_mode

map --mode herdr h combine : herdr_send_prefix : send_key h
map --mode herdr j combine : herdr_send_prefix : send_key j
map --mode herdr k combine : herdr_send_prefix : send_key k
map --mode herdr l combine : herdr_send_prefix : send_key l

map --mode herdr shift+h combine : herdr_send_prefix : send_key r : send_key h : push_keyboard_mode herdr-resize
map --mode herdr shift+j combine : herdr_send_prefix : send_key r : send_key j : push_keyboard_mode herdr-resize
map --mode herdr shift+k combine : herdr_send_prefix : send_key r : send_key k : push_keyboard_mode herdr-resize
map --mode herdr shift+l combine : herdr_send_prefix : send_key r : send_key l : push_keyboard_mode herdr-resize

map --mode herdr [ combine : herdr_send_prefix : send_key [
map --mode herdr ] combine : herdr_send_prefix : send_key ]
map --mode herdr shift+[ combine : herdr_send_prefix : send_key shift+[
map --mode herdr shift+] combine : herdr_send_prefix : send_key shift+]
map --mode herdr , combine : herdr_send_prefix : send_key ,
map --mode herdr . combine : herdr_send_prefix : send_key .

map --mode herdr p combine : herdr_send_prefix : send_key p
map --mode herdr alt+p combine : herdr_send_prefix : send_key alt+p : herdr_logo_off : pop_keyboard_mode
map --mode herdr t combine : herdr_send_prefix : send_key t : herdr_logo_off : pop_keyboard_mode
map --mode herdr alt+t combine : herdr_send_prefix : send_key alt+t : herdr_logo_off : pop_keyboard_mode
map --mode herdr v combine : herdr_send_prefix : send_key v : push_keyboard_mode herdr-copy
map --mode herdr shift+v combine : herdr_send_prefix : send_key shift+v : herdr_logo_off : pop_keyboard_mode
map --mode herdr d combine : herdr_send_prefix : send_key d
map --mode herdr shift+d combine : herdr_send_prefix : send_key shift+d
map --mode herdr shift+p combine : herdr_send_prefix : send_key shift+p : herdr_logo_off : pop_keyboard_mode
map --mode herdr shift+t combine : herdr_send_prefix : send_key shift+t : herdr_logo_off : pop_keyboard_mode
map --mode herdr z combine : herdr_send_prefix : send_key z

map --mode herdr w combine : herdr_send_prefix : send_key w
map --mode herdr alt+w combine : herdr_send_prefix : send_key alt+w : herdr_logo_off : pop_keyboard_mode
map --mode herdr shift+w combine : herdr_send_prefix : send_key shift+w : herdr_logo_off : pop_keyboard_mode
map --mode herdr space combine : herdr_send_prefix : send_key space : push_keyboard_mode herdr-selection
map --mode herdr g combine : herdr_send_prefix : send_key g : push_keyboard_mode herdr-selection
map --mode herdr shift+/ combine : herdr_send_prefix : send_key shift+/ : herdr_logo_off : pop_keyboard_mode
map --mode herdr s combine : herdr_send_prefix : send_key s : herdr_logo_off : pop_keyboard_mode
map --mode herdr r combine : herdr_send_prefix : send_key r : push_keyboard_mode herdr-resize
map --mode herdr shift+r combine : herdr_send_prefix : send_key shift+r
map --mode herdr shift+o combine : herdr_send_prefix : send_key shift+o : herdr_logo_off : pop_keyboard_mode

map --mode herdr 1 combine : herdr_send_prefix : send_key shift+1
map --mode herdr 2 combine : herdr_send_prefix : send_key shift+2
map --mode herdr 3 combine : herdr_send_prefix : send_key shift+3
map --mode herdr 4 combine : herdr_send_prefix : send_key shift+4
map --mode herdr 5 combine : herdr_send_prefix : send_key shift+5
map --mode herdr 6 combine : herdr_send_prefix : send_key shift+6
map --mode herdr 7 combine : herdr_send_prefix : send_key shift+7
map --mode herdr 8 combine : herdr_send_prefix : send_key shift+8
map --mode herdr 9 combine : herdr_send_prefix : send_key shift+9

map --mode herdr-copy esc combine : send_key esc : pop_keyboard_mode
map --mode herdr-copy q combine : send_key q : pop_keyboard_mode
map --mode herdr-copy y combine : send_key y : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode
map --mode herdr-copy shift+y combine : send_key shift+y : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode
map --mode herdr-copy ctrl+; combine : send_key esc : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode

map --mode herdr-selection esc combine : send_key esc : pop_keyboard_mode
map --mode herdr-selection q combine : send_key q : pop_keyboard_mode
map --mode herdr-selection enter combine : send_key enter : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode
map --mode herdr-selection ctrl+; combine : send_key esc : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode

map --mode herdr-resize esc combine : send_key esc : pop_keyboard_mode
map --mode herdr-resize enter combine : send_key enter : pop_keyboard_mode
map --mode herdr-resize r combine : send_key r : pop_keyboard_mode
map --mode herdr-resize ctrl+; combine : send_key esc : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode
map --mode herdr-resize h send_key h
map --mode herdr-resize j send_key j
map --mode herdr-resize k send_key k
map --mode herdr-resize l send_key l
map --mode herdr-resize left send_key left
map --mode herdr-resize down send_key down
map --mode herdr-resize up send_key up
map --mode herdr-resize right send_key right
